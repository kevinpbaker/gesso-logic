# The engine is exempt from the publish-age cooldown.
#
# pnpm will not install anything published in the last day — a good
# rule, and malware is usually found inside it. It is the wrong rule
# for these six: they are Gesso's own packages, released from the
# checkout beside this one so an engine change can reach this app the
# afternoon it is made, and a day's wait would only hold that back.
#
# The exemption is by name and only these names. Everything else from
# the registry keeps the cooldown, which is the part that was
# protecting anything.
minimumReleaseAgeExclude:
  - gesso-components
  - gesso-core
  - gesso-devtools
  - gesso-framework
  - gesso-testing
  - gesso-vite-plugin
