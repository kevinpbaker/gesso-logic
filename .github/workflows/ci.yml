# Typecheck, specs, and Phase 7's frame budget.
#
# The proof's freeze check runs Chrome with SwiftShader, so there is a
# GPU process to drive the render worker's frames while the page's main
# thread is blocked; the runner has no GPU. See scripts/proof.ts.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install, with Gesso built at the commit in gesso.lock
        run: bash scripts/ci-install.sh
      - run: pnpm typecheck
      - run: pnpm test
      - name: Frame budget
        run: pnpm proof
